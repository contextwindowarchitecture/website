document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  --muted: oklch(0.52 0.010 80);\n    --line: oklch(0.885 0.006 90);\n    --accent: oklch(0.60 0.20 38);\n    --accent-soft: oklch(0.94 0.035 45);\n  }\n  html[data-theme=\"dark\"] {\n    --bg: oklch(0.175 0.008 80);\n    --surface: oklch(0.215 0.008 80);\n    --fg: oklch(0.955 0.004 90);\n    --muted: oklch(0.68 0.010 85);\n    --line: oklch(0.305 0.008 80);\n    --accent: oklch(0.74 0.17 45);\n    --accent-soft: oklch(0.30 0.045 45);\n  }\n  /* skin B — swiss */\n  html[data-skin=\"swiss\"] {\n    --sans: 'Archivo', Helvetica, Arial, sans-serif;\n    --mono: 'Archivo', Helvetica, Arial, sans-serif;\n    --pill: 0px;\n    --bg: oklch(0.995 0 0);\n    --surface: oklch(0.965 0 0);\n    --fg: oklch(0.135 0 0);\n    --muted: oklch(0.50 0 0);\n    --line: oklch(0.855 0 0);\n    --accent: oklch(0.55 0.235 27);\n    --accent-soft: oklch(0.94 0.045 27);\n  }\n  html[data-skin=\"swiss\"][data-theme=\"dark\"] {\n    --bg: oklch(0.145 0 0);\n    --surface: oklch(0.195 0 0);\n    --fg: oklch(0.975 0 0);\n    --muted: oklch(0.68 0 0);\n    --line: oklch(0.295 0 0);\n    --accent: oklch(0.66 0.22 27);\n    --accent-soft: oklch(0.28 0.06 27);\n  }\n  /* skin C — terminal */\n  html[data-skin=\"terminal\"] {\n    --sans: 'JetBrains Mono', ui-monospace, monospace;\n    --mono: 'JetBrains Mono', ui-monospace, monospace;\n    --pill: 0px;\n    --bg: oklch(0.975 0.010 145);\n    --surface: oklch(0.945 0.014 145);\n    --fg: oklch(0.215 0.032 150);\n    --muted: oklch(0.50 0.030 150);\n    --line: oklch(0.865 0.020 145);\n    --accent: oklch(0.50 0.150 150);\n    --accent-soft: oklch(0.92 0.055 145);\n  }\n  html[data-skin=\"terminal\"][data-theme=\"dark\"] {\n    --bg: oklch(0.155 0.018 155);\n    --surface: oklch(0.195 0.022 155);\n    --fg: oklch(0.925 0.035 145);\n    --muted: oklch(0.66 0.045 150);\n    --line: oklch(0.305 0.028 155);\n    --accent: oklch(0.83 0.195 145);\n    --accent-soft: oklch(0.28 0.065 150);\n  }\n  html { background: var(--bg); scroll-behavior: smooth; overflow-x: hidden; }\n  @media (max-width: 900px) { #mainnav { display: none !important; } }\n  @media (max-width: 720px) { #skinlabel { display: none !important; } }\n  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: var(--accent); text-decoration: none; }\n  a:hover { color: var(--fg); }\n  ::selection { background: var(--accent); color: var(--bg); }\n  @keyframes cwaRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n  @keyframes cwaGrow { from { opacity: 0; transform: scaleX(0.82); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: var(--bg); color: var(--fg);\">\n\n  <header style=\"position: sticky; top: 0; z-index: 50; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 0 32px; height: 68px; display: flex; align-items: center; gap: 28px;\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; color: var(--fg);\">\n        <span style=\"display: block; width: 18px; height: 18px; border: 2px solid var(--accent); position: relative;\">\n          <span style=\"position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--accent);\"><\u002Fspan>\n          <span style=\"position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--accent);\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.06em;\">CWA<\u002Fspan>\n      <\u002Fa>\n      <nav id=\"mainnav\" style=\"display: flex; gap: 26px; margin-left: 8px; font-size: 14px; font-weight: 500;\">\n        <a href=\"#assemble\" style=\"color: var(--muted); white-space: nowrap;\" style-hover=\"color: var(--fg);\">Assembly<\u002Fa>\n        <a href=\"#layers\" style=\"color: var(--muted); white-space: nowrap;\" style-hover=\"color: var(--fg);\">The 11 layers<\u002Fa>\n        <a href=\"#why\" style=\"color: var(--muted); white-space: nowrap;\" style-hover=\"color: var(--fg);\">Why it works<\u002Fa>\n        <a href=\"#payload\" style=\"color: var(--muted); white-space: nowrap;\" style-hover=\"color: var(--fg);\">Payload<\u002Fa>\n        <a href=\"#scaffold\" style=\"color: var(--muted); white-space: nowrap;\" style-hover=\"color: var(--fg);\">Scaffold<\u002Fa>\n      <\u002Fnav>\n      <div style=\"flex: 1;\"><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ startTour }}\" style=\"font-size: 14px; font-weight: 600; color: var(--bg); background: var(--accent); border-radius: var(--pill); padding: 9px 18px; border: 0; cursor: pointer; font-family: inherit; white-space: nowrap;\" style-hover=\"background: var(--fg);\">Take the tour<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle color theme\" style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: var(--pill); padding: 7px 14px; cursor: pointer;\" style-hover=\"color: var(--fg); border-color: var(--fg);\">{{ themeLabel }}<\u002Fbutton>\n      <a href=\"https://github.com/contextwindowarchitecture\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px; font-weight: 600; color: var(--bg); background: var(--fg); border-radius: var(--pill); padding: 9px 18px;\" style-hover=\"background: var(--accent); color: var(--bg);\">GitHub<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px 72px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 34px;\">\n      <span style=\"display: block; width: 28px; height: 1px; background: var(--accent);\"><\u002Fspan>\n      <span>Reference architecture · v1<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr); gap: 56px; align-items: start;\">\n      <div>\n        <h1 style=\"margin: 0; font-size: clamp(42px, 5.6vw, 82px); line-height: 0.94; letter-spacing: -0.045em; font-weight: 700; max-width: 13ch; text-wrap: balance;\">Stop stuffing prompts. Start architecting context.<\u002Fh1>\n        <p style=\"margin: 32px 0 0; font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 46ch; text-wrap: pretty;\">The context window is the model's working memory — and the only place you get to influence its behaviour. CWA is a free, layered blueprint for organising everything you put in it: instructions, user state, retrieved knowledge, tools, history, and the query itself.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px;\">\n          <a href=\"#assemble\" style=\"font-size: 16px; font-weight: 600; color: var(--bg); background: var(--accent); border-radius: var(--pill); padding: 15px 26px;\" style-hover=\"background: var(--fg);\">Watch it assemble<\u002Fa>\n          <button sc-camel-on-click=\"{{ startTour }}\" style=\"font-size: 16px; font-weight: 600; font-family: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: var(--pill); padding: 14px 26px; cursor: pointer;\" style-hover=\"border-color: var(--fg);\">Take the guided tour<\u002Fbutton>\n          <a href=\"#scaffold\" style=\"font-size: 16px; font-weight: 600; color: var(--fg); border: 1px solid var(--line); border-radius: var(--pill); padding: 14px 26px;\" style-hover=\"border-color: var(--fg);\">Copy the scaffold<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--line); background: var(--surface); padding: 18px; min-height: 460px; display: flex; flex-direction: column;\">\n        <div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px;\">\n          <span style=\"color: var(--accent);\">Assembling · {{ mUcName }}<\u002Fspan>\n          <span>{{ mProgress }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 5px; flex: 1;\">\n          <sc-for list=\"{{ heroBlocks }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <div style=\"border-left: 2px solid var(--accent); background: var(--bg); padding: 7px 11px; animation: cwaRise 240ms cubic-bezier(.2,.8,.25,1) both;\">\n              <div style=\"font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px;\">{{ b.tag }}<\u002Fdiv>\n              <div style=\"font-family: var(--mono); font-size: 11.5px; line-height: 1.45; overflow-wrap: anywhere;\">{{ b.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px;\">\n          <div style=\"height: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden;\">\n            <div style=\"{{ mFill }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 8px;\">\n            <span>{{ mTokens }}<\u002Fspan>\n            <span>↓ one payload<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 80px;\">\n      <div style=\"background: var(--bg); padding: 26px 28px;\">\n        <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;\">Not a library<\u002Fdiv>\n        <div style=\"font-size: 17px; line-height: 1.45; text-wrap: pretty;\">Nothing to install. A design pattern you apply to the payload you already send.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--bg); padding: 26px 28px;\">\n        <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;\">Model agnostic<\u002Fdiv>\n        <div style=\"font-size: 17px; line-height: 1.45; text-wrap: pretty;\">Works with any provider, any framework, any orchestration layer you've chosen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--bg); padding: 26px 28px;\">\n        <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;\">Debuggable<\u002Fdiv>\n        <div style=\"font-size: 17px; line-height: 1.45; text-wrap: pretty;\">When output goes wrong, you know which layer to inspect first.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"assemble\" style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 80px 32px 96px;\">\n      <div data-tour=\"intro\">\n      <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">Live assembly<\u002Fdiv>\n      <h2 style=\"margin: 0 0 20px; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 20ch;\">The layers aren't the point. The assembly is.<\u002Fh2>\n      <p style=\"margin: 0 0 36px; font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 64ch; text-wrap: pretty;\">CWA doesn't ask you to fill eleven boxes. It gives you eleven named slots, and every request picks the few it actually needs — then fits them inside a finite window. Watch seven very different systems assemble a payload — then pull a layer out, or squeeze the budget, and see exactly what the model stops being able to do.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-tour=\"tabs\" style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; align-items: center;\">\n        <sc-for list=\"{{ ucTabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ tab.select }}\" style=\"{{ tab.style }}\">{{ tab.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px;\">\n        <span data-tour=\"play\" style=\"display: flex; gap: 10px;\"><button sc-camel-on-click=\"{{ togglePlay }}\" style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: var(--pill); padding: 9px 16px; cursor: pointer;\" style-hover=\"color: var(--fg); border-color: var(--fg);\">{{ playLabel }}<\u002Fbutton>\n        <button data-tour=\"badbtn\" sc-camel-on-click=\"{{ toggleBad }}\" style=\"{{ badBtnStyle }}\">{{ badLabel }}<\u002Fbutton><\u002Fspan>\n        <span style=\"width: 1px; height: 22px; background: var(--line); margin: 0 4px;\"><\u002Fspan>\n        <span data-tour=\"budget\" style=\"display: flex; align-items: center; gap: 10px;\"><span style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);\">Context budget<\u002Fspan>\n        <span style=\"display: flex; gap: 6px;\">\n          <sc-for list=\"{{ budgets }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ b.select }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n\n      <div data-tour=\"fill\" style=\"border: 1px solid var(--line); background: var(--bg); padding: 16px 18px; margin-bottom: 14px;\">\n        <div style=\"display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;\">\n          <span>Window fill<\u002Fspan>\n          <span style=\"color: var(--fg);\">{{ tokenLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 2px; height: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden;\">\n          <sc-for list=\"{{ segments }}\" as=\"seg\" hint-placeholder-count=\"0\">\n            <div style=\"{{ seg.style }}\" title=\"{{ seg.title }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--muted); margin-top: 10px;\">{{ evictionLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 28px; align-items: start;\">\n        <div data-tour=\"slots\" style=\"border: 1px solid var(--line); background: var(--bg); padding: 18px;\">\n          <div style=\"display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;\">\n            <span>Available slots<\u002Fspan>\n            <span>{{ usedLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isGood }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 14px;\">Click a slot to remove it →<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isBad }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 14px;\">Nothing to click — the slots no longer exist<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n            <sc-for list=\"{{ slots }}\" as=\"slot\" hint-placeholder-count=\"11\">\n              <button sc-camel-on-click=\"{{ slot.click }}\" title=\"{{ slot.title }}\" style=\"{{ slot.rowStyle }}\">\n                <span style=\"font-family: var(--mono); font-size: 12px; {{ slot.numColor }}\">{{ slot.num }}<\u002Fspan>\n                <span style=\"font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ slot.name }}<\u002Fspan>\n                <span style=\"{{ slot.tagStyle }}\">{{ slot.tag }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-tour=\"payload\" style=\"border: 1px solid var(--line); background: var(--bg); padding: 18px; min-height: 540px; display: flex; flex-direction: column;\">\n          <div style=\"display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px;\">\n            <span>{{ ucName }}<\u002Fspan>\n            <span>{{ progress }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\n            <sc-for list=\"{{ payload }}\" as=\"line\" hint-placeholder-count=\"6\">\n              <div style=\"{{ line.style }}\">\n                <div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px;\">\n                  <span>{{ line.tag }}<\u002Fspan>\n                  <span style=\"color: var(--muted); white-space: nowrap;\">{{ line.tokens }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family: var(--mono); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere;\">{{ line.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px;\">↓ sent to the model<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isBad }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-tour=\"badpanel\" style=\"border: 1px solid var(--fg); background: var(--bg); padding: 26px 28px; margin-top: 14px;\">\n          <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px;\">Symptom you'll actually see<\u002Fdiv>\n          <p style=\"margin: 0 0 22px; font-size: 20px; line-height: 1.45; font-weight: 500; max-width: 70ch; text-wrap: pretty;\">{{ ucSymptom }}<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; border-top: 1px solid var(--line); padding-top: 20px;\">\n            <sc-for list=\"{{ badNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <div style=\"font-size: 15px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">{{ n.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasRemoved }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-tour=\"removed\" style=\"border: 1px solid var(--accent); background: var(--accent-soft); padding: 22px 24px; margin-top: 14px;\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 16px;\">\n            <span style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg);\">What breaks without it<\u002Fspan>\n            <button sc-camel-on-click=\"{{ restoreAll }}\" style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); background: transparent; border: 1px solid var(--fg); border-radius: var(--pill); padding: 8px 15px; cursor: pointer;\">Restore all layers<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <sc-for list=\"{{ removed }}\" as=\"r\" hint-placeholder-count=\"1\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 16px; align-items: baseline;\">\n                <span style=\"font-family: var(--mono); font-size: 12px; color: var(--fg); text-decoration: line-through;\">{{ r.tag }}<\u002Fspan>\n                <span style=\"font-size: 17px; line-height: 1.5; text-wrap: pretty;\">{{ r.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-top: 0; margin-top: 28px;\">\n        <div style=\"background: var(--bg); padding: 26px 28px;\">\n          <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px;\">What this one teaches<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.55; text-wrap: pretty;\">{{ ucNote }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background: var(--bg); padding: 26px 28px;\">\n          <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px;\">Questions it forces you to answer<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ ucQuestions }}\" as=\"q\" hint-placeholder-count=\"2\">\n              <div style=\"display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 17px; line-height: 1.5;\">\n                <span style=\"color: var(--accent);\">?<\u002Fspan>\n                <span style=\"text-wrap: pretty;\">{{ q.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"layers\" style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 80px 32px 96px;\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 40px;\">\n        <div>\n          <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">The stack<\u002Fdiv>\n          <h2 style=\"margin: 0; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 20ch;\">Eleven layers, bottom to top.<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 6px; padding: 5px; border: 1px solid var(--line); border-radius: var(--pill); background: var(--bg);\">\n          <button sc-camel-on-click=\"{{ setStack }}\" style=\"{{ tabStack }}\">Stack<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ setIndex }}\" style=\"{{ tabIndex }}\">Index<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isStack }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-top: 1px solid var(--line);\">\n          <sc-for list=\"{{ layers }}\" as=\"layer\" hint-placeholder-count=\"11\">\n            <div style=\"border-bottom: 1px solid var(--line);\">\n              <button sc-camel-on-click=\"{{ layer.toggle }}\" style=\"width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; align-items: center; gap: 16px; padding: 22px 8px; background: transparent; border: 0; cursor: pointer; text-align: left; color: var(--fg); font-family: inherit;\" style-hover=\"background: var(--bg);\">\n                <span style=\"font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.06em;\">{{ layer.num }}<\u002Fspan>\n                <span style=\"font-size: clamp(22px, 2.6vw, 34px); font-weight: 600; letter-spacing: -0.025em;\">{{ layer.name }}<\u002Fspan>\n                <span style=\"justify-self: end; font-family: var(--mono); font-size: 20px; color: var(--muted);\">{{ layer.sign }}<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"{{ layer.detailStyle }}\">\n                <div style=\"display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 0 8px 28px;\">\n                  <div><\u002Fdiv>\n                  <div>\n                    <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;\">Purpose<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: var(--fg); text-wrap: pretty;\">{{ layer.purpose }}<\u002Fp>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;\">Strategic value<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">{{ layer.value }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isIndex }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n          <sc-for list=\"{{ layers }}\" as=\"layer\" hint-placeholder-count=\"11\">\n            <div style=\"background: var(--surface); padding: 28px;\">\n              <div style=\"font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 14px;\">{{ layer.num }}<\u002Fdiv>\n              <div style=\"font-size: 26px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 12px;\">{{ layer.name }}<\u002Fdiv>\n              <p style=\"margin: 0 0 10px; font-size: 15px; line-height: 1.55; text-wrap: pretty;\">{{ layer.purpose }}<\u002Fp>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">{{ layer.value }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"why\" style=\"border-top: 1px solid var(--line);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px;\">\n      <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">Why it works<\u002Fdiv>\n      <h2 style=\"margin: 0 0 52px; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 22ch;\">Prompt construction, promoted to engineering.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px;\">\n        <div>\n          <div style=\"font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 14px;\">01<\u002Fdiv>\n          <h3 style=\"margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;\">A shared vocabulary<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty;\">\"The retrieval layer is polluting the instructions layer\" is a sentence a whole team can act on. Named layers turn vague prompt debates into specific bug reports.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 14px;\">02<\u002Fdiv>\n          <h3 style=\"margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;\">Predictable behaviour<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty;\">Same slots, same order, every request. Changes become deliberate edits to one layer instead of side effects rippling through a template.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 14px;\">03<\u002Fdiv>\n          <h3 style=\"margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;\">A budget you can see<\u002Fh3>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); text-wrap: pretty;\">Tokens are finite. When every layer is separately measurable, trimming history or capping retrieval is an informed trade-off rather than a guess.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"payload\" style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px; display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 56px; align-items: start;\">\n      <div style=\"position: sticky; top: 100px;\">\n        <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">In practice<\u002Fdiv>\n        <h2 style=\"margin: 0 0 20px; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700;\">What it looks like on the wire.<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); text-wrap: pretty;\">CWA doesn't dictate syntax. Tag the layers however your stack prefers — XML-ish blocks, message roles, or delimited sections. What matters is that every layer has one obvious home and a predictable position.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.85; overflow: auto;\">\n        <div style=\"display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\">payload.txt<\u002Fdiv>\n        <div style=\"padding: 20px 18px; display: flex; flex-direction: column;\">\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L1 instructions --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;system&gt;<\u002Fspan>You are Ada, a support agent for Northwind.<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\">Never quote prices you cannot verify with a tool.<span style=\"color: var(--accent);\">&lt;/system&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L2 user info --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;user_profile&gt;<\u002Fspan>plan=pro; region=EU; tone=concise<span style=\"color: var(--accent);\">&lt;/user_profile&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L3 curated knowledge (RAG) --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;knowledge&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\">  [doc:refunds-eu] Pro plans refund within 30 days...<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;/knowledge&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L4 task state --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;task&gt;<\u002Fspan>refund_request: verify_eligibility=done, issue=pending<span style=\"color: var(--accent);\">&lt;/task&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L5-L6 memory --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;history_summary&gt;<\u002Fspan>User bought Pro in March, EU billing.<span style=\"color: var(--accent);\">&lt;/history_summary&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;history&gt;<\u002Fspan>user: is my order refundable?<span style=\"color: var(--accent);\">&lt;/history&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L7-L8 tools --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;tools&gt;<\u002Fspan>lookup_order(id), issue_refund(id, amount)<span style=\"color: var(--accent);\">&lt;/tools&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;tool_results&gt;<\u002Fspan>lookup_order(8821) -&gt; {\"total\": 240, \"days\": 12}<span style=\"color: var(--accent);\">&lt;/tool_results&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L9-L10 shaping --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;examples&gt;<\u002Fspan>Q: \"Where's my refund?\" A: \"Issued Tue, 3-5 days.\"<span style=\"color: var(--accent);\">&lt;/examples&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;format&gt;<\u002Fspan>Max 3 sentences. No bullet lists.<span style=\"color: var(--accent);\">&lt;/format&gt;<\u002Fspan><\u002Fdiv>\n          <div style=\"height: 1.85em;\"><\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted);\">&lt;!-- L11 latest query --&gt;<\u002Fdiv>\n          <div style=\"white-space: pre-wrap; overflow-wrap: anywhere;\"><span style=\"color: var(--accent);\">&lt;query&gt;<\u002Fspan>Can you just process it now?<span style=\"color: var(--accent);\">&lt;/query&gt;<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"fit\" style=\"border-top: 1px solid var(--line);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px;\">\n      <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">Where it fits<\u002Fdiv>\n      <h2 style=\"margin: 0 0 16px; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 22ch;\">It replaces nothing you already use.<\u002Fh2>\n      <p style=\"margin: 0 0 48px; font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 62ch; text-wrap: pretty;\">Your tools supply the materials. CWA is the plan that says where each material goes.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line);\">\n        <a href=\"https://contextwindowarchitecture.io/stack/rag\" target=\"_blank\" rel=\"noopener\" style=\"background: var(--bg); padding: 34px; display: block; color: var(--fg);\" style-hover=\"background: var(--accent-soft);\">\n          <div style=\"font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px;\">RAG<\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">Retrieval fills Layer 3. CWA decides how much of it gets in, how it's labelled, and what it must not overwrite.<\u002Fp>\n          <span style=\"font-family: var(--mono); font-size: 12px; color: var(--accent);\">Read →<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://contextwindowarchitecture.io/stack/mcp\" target=\"_blank\" rel=\"noopener\" style=\"background: var(--bg); padding: 34px; display: block; color: var(--fg);\" style-hover=\"background: var(--accent-soft);\">\n          <div style=\"font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px;\">Model Context Protocol<\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">MCP is the transport for tools and resources. CWA is what you do with what it returns — Layers 7 and 8.<\u002Fp>\n          <span style=\"font-family: var(--mono); font-size: 12px; color: var(--accent);\">Read →<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://contextwindowarchitecture.io/stack/agent-frameworks\" target=\"_blank\" rel=\"noopener\" style=\"background: var(--bg); padding: 34px; display: block; color: var(--fg);\" style-hover=\"background: var(--accent-soft);\">\n          <div style=\"font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px;\">Agent frameworks<\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">Frameworks orchestrate the loop. CWA governs the payload each step of that loop actually sends.<\u002Fp>\n          <span style=\"font-family: var(--mono); font-size: 12px; color: var(--accent);\">Read →<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://contextwindowarchitecture.io/stack/prompt-engineering\" target=\"_blank\" rel=\"noopener\" style=\"background: var(--bg); padding: 34px; display: block; color: var(--fg);\" style-hover=\"background: var(--accent-soft);\">\n          <div style=\"font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 10px;\">Prompt engineering<\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">Prompting is craft at the sentence level. CWA is structure at the payload level. You need both.<\u002Fp>\n          <span style=\"font-family: var(--mono); font-size: 12px; color: var(--accent);\">Read →<\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"scaffold\" data-tour=\"scaffold\" style=\"border-top: 1px solid var(--line); background: var(--surface);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 88px 32px;\">\n      <div style=\"font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px;\">Take it with you<\u002Fdiv>\n      <h2 style=\"margin: 0 0 16px; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 700; max-width: 20ch;\">Copy the scaffold. Start today.<\u002Fh2>\n      <p style=\"margin: 0 0 32px; font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 62ch; text-wrap: pretty;\">Three ways in: a builder function for your prompt code, an empty payload to fill, and a spec file your coding agents can follow.<\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center;\">\n        <sc-for list=\"{{ scaffoldTabs }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.select }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <p style=\"margin: 0 0 18px; font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 68ch; text-wrap: pretty;\">{{ scaffoldBlurb }}<\u002Fp>\n\n      <div style=\"border: 1px solid var(--line); background: var(--bg);\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);\">\n          <span>{{ scaffoldName }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ downloadScaffold }}\" style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: var(--pill); padding: 7px 14px; cursor: pointer;\" style-hover=\"color: var(--fg); border-color: var(--fg);\">Download<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding: 20px 18px; max-height: 460px; overflow: auto; font-family: var(--mono); font-size: 13px; line-height: 1.75;\">\n          <sc-for list=\"{{ scaffoldLines }}\" as=\"l\" hint-placeholder-count=\"12\">\n            <div style=\"white-space: pre; overflow-wrap: normal;\">{{ l.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 20px;\">\n        <button sc-camel-on-click=\"{{ copyScaffold }}\" style=\"{{ copyBtnStyle }}\">{{ copyLabel }}<\u002Fbutton>\n        <span style=\"font-family: var(--mono); font-size: 12px; color: var(--muted);\">No install, no dependency, no licence.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"adopt\" data-tour=\"adopt\" style=\"border-top: 1px solid var(--line); background: var(--fg); color: var(--bg);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 96px 32px;\">\n      <h2 style=\"margin: 0 0 24px; font-size: clamp(38px, 6vw, 84px); line-height: 0.95; letter-spacing: -0.045em; font-weight: 700; max-width: 16ch;\">Adopt the spec. It's free.<\u002Fh2>\n      <p style=\"margin: 0 0 40px; font-size: 19px; line-height: 1.6; opacity: 0.72; max-width: 54ch; text-wrap: pretty;\">Take the layer names, apply them to your existing prompt builder, and see how much of your payload had no owner. Then tell us what's missing.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n        <a href=\"https://github.com/contextwindowarchitecture\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 16px; font-weight: 600; color: var(--fg); background: var(--bg); border-radius: var(--pill); padding: 15px 26px;\" style-hover=\"background: var(--accent); color: var(--bg);\">View on GitHub<\u002Fa>\n        <a href=\"https://contextwindowarchitecture.io\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 16px; font-weight: 600; color: var(--bg); border: 1px solid color-mix(in oklab, var(--bg) 40%, transparent); border-radius: var(--pill); padding: 14px 26px;\" style-hover=\"border-color: var(--bg);\">Read the docs<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: var(--pill); padding: 5px; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(10px); box-shadow: 0 6px 24px oklch(0 0 0 / 0.10);\">\n    <span id=\"skinlabel\" style=\"font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 6px 0 9px;\">Skin<\u002Fspan>\n    <button sc-camel-on-click=\"{{ setSpec }}\" style=\"{{ skinSpec }}\">Spec<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ setSwiss }}\" style=\"{{ skinSwiss }}\">Swiss<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ setTerminal }}\" style=\"{{ skinTerminal }}\">Terminal<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ tourOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 90; pointer-events: none;\">\n      <div style=\"{{ maskT }}\"><\u002Fdiv>\n      <div style=\"{{ maskB }}\"><\u002Fdiv>\n      <div style=\"{{ maskL }}\"><\u002Fdiv>\n      <div style=\"{{ maskR }}\"><\u002Fdiv>\n      <div style=\"{{ tourRing }}\"><\u002Fdiv>\n      <div style=\"{{ tourCard }}\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 16px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px;\">\n          <span>{{ tourKicker }}<\u002Fspan>\n          <span style=\"color: var(--muted);\">{{ tourCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size: 20px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; margin-bottom: 10px; text-wrap: pretty;\">{{ tourTitle }}<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.55; color: var(--muted); text-wrap: pretty;\">{{ tourBody }}<\u002Fdiv>\n        <div style=\"display: flex; gap: 2px; margin: 18px 0 16px;\">\n          <sc-for list=\"{{ tourDots }}\" as=\"d\" hint-placeholder-count=\"11\">\n            <div style=\"{{ d.style }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px;\">\n          <button sc-camel-on-click=\"{{ tourNext }}\" style=\"{{ tourNextStyle }}\">{{ tourNextLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ tourBack }}\" style=\"{{ tourBackStyle }}\">Back<\u002Fbutton>\n          <div style=\"flex: 1;\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ endTour }}\" style=\"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; cursor: pointer; padding: 8px 4px;\" style-hover=\"color: var(--fg);\">{{ tourSkipLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top: 1px solid var(--line);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 40px 32px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted);\">\n      <span>Context Window Architecture — a conceptual reference architecture, not a library.<\u002Fspan>\n      <div style=\"display: flex; gap: 20px;\">\n        <a href=\"https://contextwindowarchitecture.io\" target=\"_blank\" rel=\"noopener\">Docs<\u002Fa>\n        <a href=\"https://github.com/contextwindowarchitecture\" target=\"_blank\" rel=\"noopener\">GitHub<\u002Fa>\n        <a href=\"https://contextwindowarchitecture.io/llms.txt\" target=\"_blank\" rel=\"noopener\">llms.txt<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;oklch(0.60 0.20 38)&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;oklch(0.60 0.20 38)&quot;, &quot;oklch(0.55 0.17 250)&quot;, &quot;oklch(0.55 0.14 155)&quot;, &quot;oklch(0.50 0.20 310)&quot;], &quot;section&quot;: &quot;Theme&quot;}}\">\nconst LAYERS = [\n  [\"Instructions\", \"Defines the AI's core identity, persona, goals, and ethical boundaries. Acts as the system's constitution.\", \"Ensures consistent, safe, brand-aligned behaviour and gives you one foundational control point for the whole system.\"],\n  [\"User Info\", \"Provides personalization context about the specific user: preferences, account details, entitlements, history.\", \"Drives engagement by making every response tailored, efficient, and appropriate to who is actually asking.\"],\n  [\"Curated Knowledge\", \"Injects verified, domain-specific facts relevant to the query. This is where retrieval lands.\", \"Mitigates hallucination and knowledge cut-offs, which is the difference between a demo and a system you can ship.\"],\n  [\"Task / Goal State\", \"Maintains a structured representation of an ongoing multi-step task, including sub-tasks and their statuses.\", \"Enables stateful problem-solving and lets the AI resume long-running work without losing track of progress.\"],\n  [\"Chat History Summary\", \"Holds condensed summaries of older conversation turns to serve as long-term memory.\", \"Keeps coherence across sessions, so the assistant stops asking questions it already has answers to.\"],\n  [\"Chat History\", \"Provides the raw, verbatim transcript of the most recent conversational turns.\", \"Lets the model follow the immediate flow of dialogue and resolve references like \\u201cthat one\\u201d or \\u201cdo it again\\u201d.\"],\n  [\"Tool Explanation\", \"Describes the external tools, APIs, and functions the model is allowed to invoke.\", \"Turns a text generator into an agent that can act on real systems and reach real-time data.\"],\n  [\"Function Call Results\", \"Carries the output, data, or error returned by a tool the model already called.\", \"Closes the action\\u2013perception loop so the next step is reasoned from outcomes, not assumptions.\"],\n  [\"Few Shot Examples\", \"Offers illustrative input\\u2013output pairs that demonstrate the reasoning, style, or format you want.\", \"Steers behaviour on nuanced tasks through in-context learning, with none of the cost of fine-tuning.\"],\n  [\"Output Formatting & Constraints\", \"Specifies the structure, style, or length required of the response about to be generated.\", \"Makes output directly consumable by whatever is downstream — a parser, a UI, or a person in a hurry.\"],\n  [\"Latest Query\", \"The most recent, unprocessed input from the user that the model must respond to.\", \"Triggers generation and, sitting last, benefits from the recency effect to stay the centre of attention.\"]\n];\n\nconst UCS = [\n  {\n    label: \"Support agent\",\n    symptom: \"Ada follows the refund document instead of her own price rule — and by turn thirty the \\u201cnever quote unverified prices\\u201d line has been pushed out of the window altogether.\",\n    drops: {\n      0: \"Ada loses her identity and her price rule — tone drifts and she quotes numbers she cannot verify.\",\n      1: \"EU refund terms stop applying automatically; the answer turns generic.\",\n      2: \"The 30-day policy is gone, so the model invents a refund window.\",\n      3: \"It forgets eligibility was already checked and restarts the interrogation.\",\n      5: \"It cannot tell what \\u201cit\\u201d refers to and asks the customer to repeat themselves.\",\n      6: \"No tools to call — it can describe a refund it has no way to issue.\",\n      7: \"The order amount is unknown, so the agent guesses the total or asks again.\",\n      9: \"The reply arrives as six paragraphs inside a chat bubble built for two lines.\",\n      10: \"Nothing to answer. The turn produces a summary of the conversation instead.\"\n    },\n    name: \"Refund request · live chat\",\n    picks: [\n      [0, \"You are Ada, support for Northwind. Never quote a price you cannot verify with a tool.\"],\n      [1, \"plan=pro · region=EU · tone=concise\"],\n      [2, \"[doc:refunds-eu] Pro plans refund in full within 30 days.\"],\n      [3, \"refund_request → eligibility=done, issue=pending\"],\n      [5, \"user: is my order refundable?\"],\n      [6, \"lookup_order(id) · issue_refund(id, amount)\"],\n      [7, \"lookup_order(8821) → { total: 240, days: 12 }\"],\n      [9, \"Max 3 sentences. No bullet lists.\"],\n      [10, \"Can you just process it now?\"]\n    ],\n    note: \"No summary layer and no examples — the conversation is four turns old and the format is trivial. Empty slots cost tokens and add noise, so they stay empty.\",\n    questions: [\"Does the no-unverified-prices rule live in instructions, or in a tool guard?\", \"If retrieval returns nothing, should the agent still answer?\"]\n  },\n  {\n    label: \"Code review bot\",\n    symptom: \"The lint config reads as an instruction, so the bot starts rewriting the repo's style instead of reviewing the diff it was given.\",\n    drops: {\n      0: \"It reviews the whole file instead of the diff and the PR fills with noise.\",\n      2: \"House conventions vanish; it flags style the repo deliberately allows.\",\n      6: \"It can describe problems but cannot post a single comment.\",\n      7: \"No diff in the window — it reviews a pull request it has never seen.\",\n      8: \"Comment tone slides from specific to generic \\u201cconsider refactoring\\u201d.\",\n      9: \"Free-form prose comes back and the CI job fails to parse it.\",\n      10: \"No trigger. The job runs and returns nothing.\"\n    },\n    name: \"Pull request #482 · CI job\",\n    picks: [\n      [0, \"You review diffs. Comment only on lines that changed.\"],\n      [2, \"repo conventions · eslint config · CODEOWNERS\"],\n      [6, \"fetch_diff(pr) · post_comment(file, line, body)\"],\n      [7, \"fetch_diff(482) → 3 files, 214 lines changed\"],\n      [8, \"Two approved review comments from last week.\"],\n      [9, \"JSON array: { file, line, severity, note }\"],\n      [10, \"Review PR #482.\"]\n    ],\n    note: \"No user info, no chat history — a CI job has no conversation and no person. The examples layer does the steering that personalization does elsewhere.\",\n    questions: [\"Are repo conventions knowledge, or part of the tool result?\", \"What gets dropped first when the diff is 4,000 lines?\"]\n  },\n  {\n    label: \"Clinical triage\",\n    symptom: \"The protocol text outranks the never-diagnose rule and the assistant confidently names a condition.\",\n    drops: {\n      0: \"The escalation rule is gone and the assistant offers a diagnosis instead.\",\n      1: \"Age and hypertension disappear, so chest pain reads as low risk.\",\n      2: \"The triage protocol is missing and the advice becomes improvised.\",\n      4: \"Prior BP history is lost; the pattern across visits goes unnoticed.\",\n      5: \"The symptom described this morning never reaches the model.\",\n      9: \"A reassuring essay comes back where a risk tier was required.\",\n      10: \"There is no question left to triage.\"\n    },\n    name: \"Intake triage · patient portal\",\n    picks: [\n      [0, \"Triage assistant. Never diagnose. Escalate red-flag symptoms immediately.\"],\n      [1, \"age 61 · known hypertension · EU patient record\"],\n      [2, \"[protocol] chest pain — triage decision steps\"],\n      [4, \"Two BP checks this year; last visit March, no acute findings.\"],\n      [5, \"patient: pressure in my chest since this morning\"],\n      [9, \"Return risk tier and next step only. No reassurance.\"],\n      [10, \"Should I just wait until Monday?\"]\n    ],\n    note: \"History arrives summarised, not verbatim: what matters is the clinical thread, not the wording of a visit in March. That is a Layer 5 decision, made once, applied everywhere.\",\n    questions: [\"What has to be redacted before Layer 2 leaves your network?\", \"Which layer holds the escalation rule so a user can never argue it away?\"]\n  },\n  {\n    label: \"Weekly brief\",\n    symptom: \"Last week's brief is indistinguishable from this week's data, so last week's numbers get reported as current.\",\n    drops: {\n      0: \"Citations stop and numbers appear with no traceable source row.\",\n      2: \"No pipeline data — the brief gets written out of thin air.\",\n      3: \"It restarts at section one and rewrites what was already approved.\",\n      8: \"Voice drifts away from the house style established last week.\",\n      9: \"Length and structure wander and the newsletter template breaks.\",\n      10: \"No instruction to generate. The batch job returns an empty brief.\"\n    },\n    name: \"Monday sales brief · scheduled batch\",\n    picks: [\n      [0, \"Analyst voice. Every number cites the source row.\"],\n      [2, \"pipeline snapshot · 41 open deals · 6 closed lost\"],\n      [3, \"brief week 30 → section 2 of 5 drafted\"],\n      [8, \"Last week's approved brief, as a style reference.\"],\n      [9, \"800 words. Four headings. No preamble.\"],\n      [10, \"Generate this week's brief.\"]\n    ],\n    note: \"There is no user and no conversation at all. Same eleven slots, five of them filled — and six deliberately empty is the correct answer, not a gap to fill.\",\n    questions: [\"Is last week's brief an example, or is it knowledge?\", \"Where does \\u201cdon't repeat last week\\u201d actually live?\"]\n  },\n  {\n    label: \"Voice ordering\",\n    symptom: \"The entire menu is re-read into the window on every turn; the reply lands two seconds late and the customer starts repeating themselves.\",\n    drops: {\n      0: \"Confirmation discipline is gone and items get added twice.\",\n      1: \"The usual order is forgotten and a regular is treated as a stranger.\",\n      3: \"It loses the cart and asks the customer to start over.\",\n      5: \"The correction \\u201cmake that iced\\u201d is never heard.\",\n      6: \"It agrees to the order but nothing reaches the kitchen.\",\n      7: \"It cannot state the total, so the lane stalls at the window.\",\n      9: \"The reply comes back with bullet symbols the speech engine reads aloud.\",\n      10: \"Silence. There is nothing to respond to.\"\n    },\n    name: \"Drive-thru lane 3 · realtime voice\",\n    picks: [\n      [0, \"Order taker. Confirm every item once. Never upsell twice.\"],\n      [1, \"loyalty member · usual order: large oat latte\"],\n      [3, \"order → 2 items confirmed, payment pending\"],\n      [5, \"customer: uh — make that iced\"],\n      [6, \"add_item(sku, mods) · price_order(cart)\"],\n      [7, \"price_order(cart) → $11.40\"],\n      [9, \"One short sentence. Speakable. No symbols or lists.\"],\n      [10, \"And a hash brown.\"]\n    ],\n    note: \"No retrieval and no summary. The menu is small enough to sit in instructions, and the latency budget is measured in hundreds of milliseconds — every token you skip is time the customer doesn't wait.\",\n    questions: [\"Where does the menu live once it grows to 400 items with regional pricing?\", \"What is the token ceiling before the pause before speech becomes audible?\"]\n  },\n  {\n    label: \"Incident copilot\",\n    symptom: \"The runbook reads as a command rather than a reference, and the copilot proposes a failover step as though it had been told to run one.\",\n    drops: {\n      0: \"The confirmation gate disappears and it proposes running failover unprompted.\",\n      2: \"The runbook is gone and the copilot improvises during a sev-1.\",\n      3: \"It forgets mitigation was proposed and loops back to diagnosis.\",\n      4: \"The first forty minutes are lost; it re-suggests what already failed.\",\n      6: \"It can advise but cannot page anyone or read a single metric.\",\n      7: \"p99 latency is unknown, so severity becomes guesswork.\",\n      9: \"A wall of prose lands in the incident channel with no owners.\",\n      10: \"No question. The copilot waits.\"\n    },\n    name: \"INC-2291 · production sev-1\",\n    picks: [\n      [0, \"Incident copilot. Never run a mutating command without explicit confirmation.\"],\n      [2, \"[runbook] p1 database failover — steps and rollback\"],\n      [3, \"INC-2291 → cause identified, mitigation proposed, comms pending\"],\n      [4, \"First 40 minutes: latency spike traced to replica lag in eu-west.\"],\n      [6, \"query_metrics · page_oncall · run_runbook_step\"],\n      [7, \"query_metrics(p99, 5m) → 4.2s and rising\"],\n      [9, \"Next three actions as bullets, each with an owner.\"],\n      [10, \"What do we do next?\"]\n    ],\n    note: \"Forty minutes of chatter collapses into one summary line while raw tool output stays verbatim. Compression where wording is disposable, precision where a digit changes the decision.\",\n    questions: [\"Which layer holds the confirmation gate — and does it survive being summarised?\", \"When metrics refresh every ten seconds, do stale results stay in the window?\"]\n  },\n  {\n    label: \"Language tutor\",\n    symptom: \"Old corrections become live instructions, so the tutor keeps correcting things the learner fixed weeks ago.\",\n    drops: {\n      0: \"Corrections pile up and the learner is buried in red ink.\",\n      1: \"B1 level unknown, so replies swing to native-speed Spanish.\",\n      4: \"Past sessions vanish and the same subjunctive lesson repeats forever.\",\n      5: \"The sentence being corrected is not in the window.\",\n      8: \"Correction style turns clinical instead of encouraging.\",\n      9: \"It answers in English and corrects five things at once.\",\n      10: \"There is nothing to check.\"\n    },\n    n
