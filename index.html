ame: \"Spanish B1 · session 27\",\n    picks: [\n      [0, \"Patient tutor. Correct one thing, then keep the conversation moving.\"],\n      [1, \"level B1 · 34-day streak · shaky on the subjunctive\"],\n      [4, \"Earlier sessions: preterite mastered, avoids the formal register.\"],\n      [5, \"learner: si tuviera tiempo, iría contigo\"],\n      [8, \"Two past corrections written in the tone we want.\"],\n      [9, \"Reply in Spanish. One correction maximum.\"],\n      [10, \"Is that right?\"]\n    ],\n    note: \"No tools and nothing retrieved — but two memory layers and personalization carry the whole experience. Completely different system, same eleven slots.\",\n    questions: [\"What earns a place in long-term memory versus a disposable session log?\", \"Is proficiency a stored fact in Layer 2, or inferred fresh each turn?\"]\n  }\n];\n\n/* illustrative block sizes, in tokens — order matches LAYERS */\nconst LAYER_TOKENS = [240, 90, 1500, 160, 320, 850, 400, 600, 450, 70, 40];\n/* what a budget squeeze drops first; L01, L10 and L11 are never dropped */\nconst DROP_ORDER = [8, 4, 1, 5, 2, 3, 7, 6];\nconst BUDGETS = [8192, 4096, 2048, 1024];\n\nconst SCAFFOLDS = [\n  {\n    label: \"Builder\", filename: \"context.py\",\n    blurb: \"Drop this next to your prompt code. Every layer is optional; the order is the contract.\",\n    text: [\n      \"# Context Window Architecture — assembly scaffold\",\n      \"# Keep the order. Delete the layers your system does not need.\",\n      \"# An empty layer costs tokens and adds noise: return None instead.\",\n      \"\",\n      \"def build_context(req):\",\n      \"    return join([\",\n      \"        block('instructions',    SYSTEM_RULES),                  # L1  identity, boundaries, refusals\",\n      \"        block('user_info',       profile(req.user)),             # L2  personalization\",\n      \"        block('knowledge',       retrieve(req.query, k=5)),      # L3  verified facts — RAG lands here\",\n      \"        block('task_state',      req.task.snapshot()),           # L4  multi-step progress\",\n      \"        block('history_summary', memory.summarize(req.session)), # L5  long-term memory\",\n      \"        block('history',         req.session.recent(turns=6)),   # L6  verbatim recent turns\",\n      \"        block('tools',           tool_specs(req.allowed)),       # L7  what it may call\",\n      \"        block('tool_results',    req.pending_results),           # L8  what came back\",\n      \"        block('examples',        FEW_SHOT),                      # L9  in-context steering\",\n      \"        block('format',          OUTPUT_CONTRACT),               # L10 shape of the answer\",\n      \"        block('query',           req.message),                   # L11 always last\",\n      \"    ])\",\n      \"\",\n      \"def block(tag, body):\",\n      \"    if not body:\",\n      \"        return None          # omit the layer rather than emitting an empty tag\",\n      \"    return f'<{tag}>\\\\n{body}\\\\n<\u002F{tag}>'\",\n      \"\",\n      \"def join(blocks):\",\n      \"    return '\\\\n\\\\n'.join(b for b in blocks if b)\"\n    ].join(\"\\n\")\n  },\n  {\n    label: \"Payload\", filename: \"payload.txt\",\n    blurb: \"The wire format, empty. Tag however your stack prefers — what matters is one home per layer.\",\n    text: [\n      \"<!-- L1  instructions --------------------------------------------- -->\",\n      \"<instructions><\u002Finstructions>\",\n      \"\",\n      \"<!-- L2  user info ----------------------------------------------- -->\",\n      \"<user_info><\u002Fuser_info>\",\n      \"\",\n      \"<!-- L3  curated knowledge (retrieval lands here) ----------------- -->\",\n      \"<knowledge><\u002Fknowledge>\",\n      \"\",\n      \"<!-- L4  task / goal state ---------------------------------------- -->\",\n      \"<task_state><\u002Ftask_state>\",\n      \"\",\n      \"<!-- L5  chat history summary ------------------------------------- -->\",\n      \"<history_summary><\u002Fhistory_summary>\",\n      \"\",\n      \"<!-- L6  chat history (verbatim, bounded) -------------------------- -->\",\n      \"<history><\u002Fhistory>\",\n      \"\",\n      \"<!-- L7  tool explanation ------------------------------------------ -->\",\n      \"<tools><\u002Ftools>\",\n      \"\",\n      \"<!-- L8  function call results -------------------------------------- -->\",\n      \"<tool_results><\u002Ftool_results>\",\n      \"\",\n      \"<!-- L9  few shot examples ------------------------------------------ -->\",\n      \"<examples><\u002Fexamples>\",\n      \"\",\n      \"<!-- L10 output formatting and constraints --------------------------- -->\",\n      \"<format><\u002Fformat>\",\n      \"\",\n      \"<!-- L11 latest query (always last) ---------------------------------- -->\",\n      \"<query><\u002Fquery>\"\n    ].join(\"\\n\")\n  },\n  {\n    label: \"For agents\", filename: \"cwa.md\",\n    blurb: \"Put this in your repo so coding agents assemble context the same way your team does.\",\n    text: [\n      \"# Context Window Architecture (CWA)\",\n      \"\",\n      \"Assemble every LLM payload from these eleven layers, in this order.\",\n      \"Omit a layer when it has no content. Never reorder them.\",\n      \"\",\n      \"| #   | Layer                 | Holds                                          | Omit when                          |\",\n      \"| --- | --------------------- | ---------------------------------------------- | ---------------------------------- |\",\n      \"| L1  | Instructions          | Identity, rules, refusals, ethical boundaries  | Never omit                         |\",\n      \"| L2  | User Info             | Preferences, entitlements, account facts       | No specific user (batch jobs, CI)  |\",\n      \"| L3  | Curated Knowledge     | Verified retrieved facts                       | Nothing was retrieved              |\",\n      \"| L4  | Task / Goal State     | Structured multi-step progress                 | Single-turn work                   |\",\n      \"| L5  | Chat History Summary  | Condensed older turns                          | Short or first session             |\",\n      \"| L6  | Chat History          | Verbatim recent turns, bounded                 | No conversation                    |\",\n      \"| L7  | Tool Explanation      | Callable tools and their signatures            | No tools available                 |\",\n      \"| L8  | Function Call Results | Output of tools already run                    | Nothing has been called yet        |\",\n      \"| L9  | Few Shot Examples     | Input/output pairs that steer behaviour        | Task is simple or well specified   |\",\n      \"| L10 | Output Formatting     | Required structure, style, length              | Free-form answer is acceptable     |\",\n      \"| L11 | Latest Query          | The unprocessed user request                   | Never omit                         |\",\n      \"\",\n      \"## Rules\",\n      \"\",\n      \"1. One home per fact. Retrieved text never goes in L1.\",\n      \"2. L11 is always last so it keeps the recency advantage.\",\n      \"3. Bound L6. When it grows, summarise into L5 rather than truncating blindly.\",\n      \"4. Budget each layer separately so you know what to trim first.\",\n      \"5. Label every layer in the payload so a failure can be traced to one of them.\",\n      \"\",\n      \"Reference: https://contextwindowarchitecture.io\"\n    ].join(\"\\n\")\n  }\n];\n\nclass Component extends DCLogic {\n  state = { mode: \"stack\", open: { 0: true }, theme: \"light\", skin: \"spec\", run: 0, uc: 0, step: 0, hold: 0, playing: true };\n\n  componentWillUnmount() {\n    clearInterval(this._t); clearInterval(this._m); clearInterval(this._track);\n    if (this._tourKeys) document.removeEventListener(\"keydown\", this._tourKeys);\n    if (this._tourScroll) { window.removeEventListener(\"scroll\", this._tourScroll); window.removeEventListener(\"resize\", this._tourScroll); }\n  }\n\n  startHeroClock() {\n    clearInterval(this._m);\n    this._m = setInterval(() => {\n      const n = UCS[this.state.mUc || 0].picks.length;\n      const step = this.state.mStep || 0;\n      if (step < n) this.setState({ mStep: step + 1 });\n      else if ((this.state.mHold || 0) < 4) this.setState(s => ({ mHold: (s.mHold || 0) + 1 }));\n      else this.setState(s => ({ mUc: ((s.mUc || 0) + 1) % UCS.length, mStep: 0, mHold: 0 }));\n    }, 520);\n  }\n\n  copyScaffold() {\n    const sc = SCAFFOLDS[this.state.scaffold || 0];\n    const done = () => {\n      this.setState({ copied: true });\n      clearTimeout(this._c);\n      this._c = setTimeout(() => this.setState({ copied: false }), 2200);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(sc.text).then(done, () => this.fallbackCopy(sc.text, done));\n    } else this.fallbackCopy(sc.text, done);\n  }\n\n  fallbackCopy(text, done) {\n    const ta = document.createElement(\"textarea\");\n    ta.value = text;\n    ta.style.position = \"fixed\";\n    ta.style.opacity = \"0\";\n    document.body.appendChild(ta);\n    ta.select();\n    try { document.execCommand(\"copy\"); } catch (e) {}\n    document.body.removeChild(ta);\n    done();\n  }\n\n  downloadScaffold() {\n    const sc = SCAFFOLDS[this.state.scaffold || 0];\n    const url = URL.createObjectURL(new Blob([sc.text], { type: \"text/plain\" }));\n    const a = document.createElement(\"a\");\n    a.href = url;\n    a.download = sc.filename;\n    document.body.appendChild(a);\n    a.click();\n    document.body.removeChild(a);\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  }\n\n  offMap(uc) { return (this.state.off || {})[uc] || {}; }\n\n  activePicks(uc) {\n    const off = this.offMap(uc);\n    return UCS[uc].picks.filter(p => !off[p[0]]);\n  }\n\n  toggleSlot(layer) {\n    const uc = this.state.uc;\n    const cur = Object.assign({}, this.offMap(uc));\n    if (cur[layer]) delete cur[layer]; else cur[layer] = true;\n    const off = Object.assign({}, this.state.off || {});\n    off[uc] = cur;\n    this.setState({ off, playing: false, step: 99, hold: 0 });\n  }\n\n  restoreSlots() {\n    const off = Object.assign({}, this.state.off || {});\n    delete off[this.state.uc];\n    this.setState({ off, step: 99 });\n  }\n\n  startClock() {\n    clearInterval(this._t);\n    this._t = setInterval(() => {\n      if (!this.state.playing) return;\n      const n = this.activePicks(this.state.uc).length;\n      if (this.state.step < n) this.setState(s => ({ step: s.step + 1 }));\n      else if (this.state.hold < 5) this.setState(s => ({ hold: s.hold + 1 }));\n      else this.setState(s => ({ uc: (s.uc + 1) % UCS.length, step: 0, hold: 0 }));\n    }, 620);\n  }\n\n  componentDidMount() {\n    let t = \"light\", s = \"spec\";\n    try {\n      t = localStorage.getItem(\"cwa-theme\") || (matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\");\n      s = localStorage.getItem(\"cwa-skin\") || \"spec\";\n    } catch (e) {}\n    this.applyTheme(t);\n    this.applySkin(s);\n    this.startClock();\n    this.startHeroClock();\n  }\n\n  ucTabStyle(active) {\n    return \"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid \" +\n      (active ? \"var(--accent)\" : \"var(--line)\") + \"; border-radius: var(--pill); padding: 9px 16px; cursor: pointer; background: \" +\n      (active ? \"var(--accent)\" : \"transparent\") + \"; color: \" + (active ? \"var(--bg)\" : \"var(--muted)\") + \";\";\n  }\n\n  applySkin(s) {\n    document.documentElement.setAttribute(\"data-skin\", s);\n    try { localStorage.setItem(\"cwa-skin\", s); } catch (e) {}\n    this.setState({ skin: s });\n  }\n\n  skinBtn(active) {\n    return \"font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; border: 0; border-radius: var(--pill); padding: 6px 11px; cursor: pointer; background: \" +\n      (active ? \"var(--accent)\" : \"transparent\") + \"; color: \" + (active ? \"var(--bg)\" : \"var(--muted)\") + \";\";\n  }\n\n  applyTheme(t) {\n    document.documentElement.setAttribute(\"data-theme\", t);\n    try { localStorage.setItem(\"cwa-theme\", t); } catch (e) {}\n    this.setState({ theme: t });\n  }\n\n  tab(active) {\n    return \"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; background: \" +\n      (active ? \"var(--fg)\" : \"transparent\") + \"; color: \" + (active ? \"var(--bg)\" : \"var(--muted)\") + \";\";\n  }\n\n  tourSteps() {\n    const reset = () => this.setState({ bad: false, off: {}, budget: 0, uc: 0, step: 0, hold: 0, playing: true });\n    const pickRemovable = () => {\n      const cand = UCS[this.state.uc].picks.map(p => p[0]).filter(i => i !== 0 && i !== 9 && i !== 10);\n      return cand.length ? cand[Math.floor(cand.length / 2)] : null;\n    };\n    return [\n      { key: \"intro\", kicker: \"Guided tour\", title: \"One request, one assembly\",\n        body: \"CWA gives you eleven named slots. No system uses all of them. What makes a system work is which few you pick, and the order you put them in.\",\n        act: reset },\n      { key: \"tabs\", kicker: \"Step 1 · The systems\", title: \"Seven very different systems\",\n        body: \"A support agent, a code reviewer, a clinical triage assistant. Identical vocabulary, completely different assemblies. Switch tabs whenever you like — the tour keeps up.\",\n        act: () => this.setState({ uc: 0, step: 0, hold: 0, playing: true, bad: false }) },\n      { key: \"play\", kicker: \"Step 2 · Controls\", title: \"Freeze it to read it\",\n        body: \"The demo cycles on its own. We've paused it here so the whole payload is on screen — press Play again any time.\",\n        act: () => this.setState({ playing: false, step: 99 }) },\n      { key: \"slots\", kicker: \"Step 3 · The slots\", title: \"Highlighted, queued, or unused\",\n        body: \"Lit rows are in this payload. Faded rows exist in the spec but this system doesn't need them — that's a design decision you made, not a gap you left.\",\n        act: () => this.setState({ playing: false, step: 99 }) },\n      { key: \"payload\", kicker: \"Step 4 · The payload\", title: \"Every block is attributable\",\n        body: \"Each block carries the layer it came from and what it costs. When the answer goes wrong, you already know which block to open first.\",\n        act: () => this.setState({ playing: false, step: 99 }) },\n      { key: \"budget\", kicker: \"Step 5 · The budget\", title: \"Real windows are finite\",\n        body: \"We just squeezed this one to 2k. The assembler now has to decide what survives — and it evicts in a fixed priority order rather than truncating blindly.\",\n        act: () => this.setState({ budget: 2, playing: false, step: 99 }) },\n      { key: \"fill\", kicker: \"Step 6 · Eviction\", title: \"What got dropped, and why\",\n        body: \"The bar is the window; the line beneath names everything eviction removed. Instructions and the live query never go. The system still answers — it just knows less.\",\n        act: () => this.setState({ budget: 2, playing: false, step: 99 }) },\n      { key: \"removed\", kicker: \"Step 7 · Consequences\", title: \"Pull a layer out yourself\",\n        body: \"We removed one for you. The panel spells out exactly what the model can no longer do without it. Click any slot on the left to try your own.\",\n        act: () => { const li = pickRemovable(); if (li !== null) this.toggleSlot(li); this.setState({ budget: 0 }); } },\n      { key: \"badpanel\", kicker: \"Step 8 · The counter-example\", title: \"Same context, badly assembled\",\n        body: \"Nothing was removed here — everything was fused into one blob. This is the failure CWA is actually designed to prevent.\",\n        act: () => this.setState({ off: {}, bad: true, playing: false, step: 99, budget: 0 }) },\n      { key: \"scaffold\", kicker: \"Step 9 · Take it with you\", title: \"Three artifacts, zero install\",\n        body: \"A Python builder, an empty wire-format payload, and a cwa.md your coding agents can follow. Copy one and your next payload is already layered.\",\n        act: () => this.setState({ bad: false, off: {}, playing: true, step: 0, hold: 0 }) },\n      { key: \"adopt\", kicker: \"Last step\", title: \"Start with one layer\",\n        body: \"You don't adopt CWA in a sprint. Name the layers you already send, give each one a home in the payload, and the rest follows.\",\n        act: () => {}, last: true }\n    ];\n  }\n\n  startTour() {\n    if (this._tourKeys) document.removeEventListener(\"keydown\", this._tourKeys);\n    this._tourKeys = e => {\n      if (e.key === \"Escape\") this.endTour();\n      else if (e.key === \"ArrowRight\" || e.key === \"Enter\") this.tourGo(1);\n      else if (e.key === \"ArrowLeft\") this.tourGo(-1);\n    };\n    document.addEventListener(\"keydown\", this._tourKeys);\n    this._tourScroll = () => this.measureTour();\n    window.addEventListener(\"scroll\", this._tourScroll, { passive: true });\n    window.addEventListener(\"resize\", this._tourScroll);\n    this.setState({ tour: 0 }, () => this.enterStep());\n  }\n\n  endTour() {\n    clearInterval(this._track);\n    if (this._tourKeys) document.removeEventListener(\"keydown\", this._tourKeys);\n    if (this._tourScroll) {\n      window.removeEventListener(\"scroll\", this._tourScroll);\n      window.removeEventListener(\"resize\", this._tourScroll);\n    }\n    this.setState({ tour: null, trect: null, playing: true });\n  }\n\n  tourGo(d) {\n    if (this.state.tour === null || this.state.tour === undefined) return;\n    const n = this.tourSteps().length;\n    const i = this.state.tour + d;\n    if (i < 0) return;\n    if (i >= n) { this.endTour(); return; }\n    this.setState({ tour: i }, () => this.enterStep());\n  }\n\n  enterStep() {\n    const st = this.tourSteps()[this.state.tour];\n    if (!st) return;\n    if (st.act) st.act();\n    clearInterval(this._track);\n    setTimeout(() => {\n      const el = document.querySelector('[data-tour=\"' + st.key + '\"]');\n      if (el) {\n        const sc = document.scrollingElement || document.documentElement;\n        const r = el.getBoundingClientRect();\n        const target = Math.max(0, sc.scrollTop + r.top - Math.max(96, (window.innerHeight - Math.min(r.height, 460)) / 2));\n        try { window.scrollTo({ top: target, behavior: \"smooth\" }); } catch (e) { window.scrollTo(0, target); }\n        setTimeout(() => {\n          if (Math.abs(sc.scrollTop - target) > 4) sc.scrollTop = target;\n          if (Math.abs(sc.scrollTop - target) > 4) document.body.scrollTop = target;\n        }, 260);\n      }\n      let n = 0;\n      this._track = setInterval(() => {\n        this.measureTour();\n        if (++n > 22) clearInterval(this._track);\n      }, 55);\n    }, 90);\n  }\n\n  measureTour() {\n    if (this.state.tour === null || this.state.tour === undefined) return;\n    const st = this.tourSteps()[this.state.tour];\n    const el = st && document.querySelector('[data-tour=\"' + st.key + '\"]');\n    if (!el) { if (this.state.trect) this.setState({ trect: null }); return; }\n    const r = el.getBoundingClientRect();\n    const p = this.state.trect;\n    if (p && Math.abs(p.t - r.top) < 0.6 && Math.abs(p.l - r.left) < 0.6 && Math.abs(p.h - r.height) < 0.6) return;\n    this.setState({ trect: { t: r.top, l: r.left, w: r.width, h: r.height } });\n  }\n\n  tourVals(out) {\n    const i = this.state.tour;\n    out.tourOn = i !== null && i !== undefined;\n    out.startTour = () => this.startTour();\n    out.endTour = () => this.endTour();\n    if (!out.tourOn) return;\n    const steps = this.tourSteps();\n    const st = steps[i];\n    const W = window.innerWidth, H = window.innerHeight;\n    const raw = this.state.trect;\n    /* if the target never scrolled into view, fall back to the centered card + full dim */\n    const r = raw && raw.t < H - 40 && raw.t + raw.h > 40 ? raw : null;\n    const CW = Math.min(400, W - 40), CH = 300;\n    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n    let top, left;\n    if (!r) { top = (H - CH) / 2; left = (W - CW) / 2; }\n    else if (H - (r.t + r.h) > CH + 26) { top = r.t + r.h + 18; left = clamp(r.l, 20, W - CW - 20); }\n    else if (r.t > CH + 26) { top = r.t - CH - 18; left = clamp(r.l, 20, W - CW - 20); }\n    else if (W - (r.l + r.w) > CW + 44) { left = r.l + r.w + 20; top = clamp(r.t, 92, H - CH - 20); }\n    else if (r.l > CW + 44) { left = r.l - CW - 20; top = clamp(r.t, 92, H - CH - 20); }\n    else { left = W - CW - 24; top = H - CH - 24; }\n    top = clamp(top, 16, Math.max(16, H - CH - 16));\n    left = clamp(left, 16, Math.max(16, W - CW - 16));\n    const dim = \"position: absolute; background: oklch(0 0 0 / 0.58); pointer-events: none; transition: all 200ms cubic-bezier(.2,.8,.25,1);\";\n    if (r) {\n      const x0 = Math.max(0, r.l - 8), y0 = Math.max(0, r.t - 8);\n      const x1 = Math.min(W, r.l + r.w + 8), y1 = Math.min(H, r.t + r.h + 8);\n      out.tourRing = \"position: absolute; left: \" + x0 + \"px; top: \" + y0 + \"px; width: \" + (x1 - x0) + \"px; height: \" + (y1 - y0) +\n        \"px; border: 2px solid var(--accent); pointer-events: none; transition: all 220ms cubic-bezier(.2,.8,.25,1);\";\n      out.maskT = dim + \"left: 0; right: 0; top: 0; height: \" + y0 + \"px;\";\n      out.maskB = dim + \"left: 0; right: 0; top: \" + y1 + \"px; bottom: 0;\";\n      out.maskL = dim + \"left: 0; width: \" + x0 + \"px; top: \" + y0 + \"px; height: \" + (y1 - y0) + \"px;\";\n      out.maskR = dim + \"left: \" + x1 + \"px; right: 0; top: \" + y0 + \"px; height: \" + (y1 - y0) + \"px;\";\n    } else {\n      out.tourRing = \"display: none;\";\n      out.maskT = dim + \"inset: 0;\";\n      out.maskB = \"display: none;\"; out.maskL = \"display: none;\"; out.maskR = \"display: none;\";\n    }\n    out.tourCard = \"position: absolute; box-sizing: border-box; left: \" + Math.round(left) + \"px; top: \" + Math.round(top) + \"px; width: \" + CW +\n      \"px; pointer-events: auto; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 22px 24px; box-shadow: 0 18px 50px oklch(0 0 0 / 0.35); transition: left 220ms cubic-bezier(.2,.8,.25,1), top 220ms cubic-bezier(.2,.8,.25,1);\";\n    out.tourKicker = st.kicker;\n    out.tourTitle = st.title;\n    out.tourBody = st.body;\n    out.tourCount = (i + 1) + \" / \" + steps.length;\n    out.tourDots = steps.map((s, k) => ({\n      style: \"flex: 1; height: 3px; background: \" + (k <= i ? \"var(--accent)\" : \"var(--line)\") + \"; transition: background 220ms ease;\"\n    }));\n    out.tourNext = st.last\n      ? () => { this.endTour(); window.open(\"https://contextwindowarchitecture.io\", \"_blank\", \"noopener\"); }\n      : () => this.tourGo(1);\n    out.tourBack = () => this.tourGo(-1);\n    out.tourNextLabel = st.last ? \"Read the spec\" : \"Next\";\n    out.tourSkipLabel = st.last ? \"Close\" : \"Skip tour\";\n    out.tourNextStyle = \"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); background: var(--accent); border: 0; border-radius: var(--pill); padding: 11px 20px; cursor: pointer;\";\n    out.tourBackStyle = \"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: var(--pill); padding: 10px 18px; cursor: pointer; visibility: \" + (i === 0 ? \"hidden\" : \"visible\") + \";\";\n  }\n\n  renderVals() {\n    const accent = this.props.accent || null;\n    if (accent) document.documentElement.style.setProperty(\"--accent\", accent);\n    const mode = this.state.mode;\n    const run = this.state.run;\n    const layers = LAYERS.map((l, i) => {\n      const open = !!this.state.open[i];\n      return {\n        num: \"L\" + String(i + 1).padStart(2, \"0\"),\n        name: l[0],\n        purpose: l[1],\n        value: l[2],\n        sign: open ? \"−\" : \"+\",\n        detailStyle: \"display: \" + (open ? \"block\" : \"none\") + \"; animation: cwaRise 260ms ease both;\",\n        barStyle: \"display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); animation: cwaGrow 420ms cubic-bezier(.2,.8,.25,1) both; animation-delay: \" + (i * 90) + \"ms;\",\n        toggle: () => this.setState(s => ({ open: Object.assign({}, s.open, { [i]: !s.open[i] }) }))\n      };\n    });\n    const uc = UCS[this.state.uc];\n    const off = this.offMap(this.state.uc);\n    const allPicks = uc.picks;\n    const picks = allPicks.filter(p => !off[p[0]]);\n    const step = Math.min(this.state.step, picks.length);\n    const removed = allPicks.filter(p => off[p[0]]).map(p => ({\n      tag: \"L\" + String(p[0] + 1).padStart(2, \"0\") + \" \" + LAYERS[p[0]][0],\n      text: (uc.drops && uc.drops[p[0]]) || \"That layer's contribution is simply absent from the payload.\",\n      restore: () => this.toggleSlot(p[0])\n    }));\n    const budget = BUDGETS[this.state.budget || 0];\n    const evicted = {};\n    let planned = picks.reduce((t, p) => t + LAYER_TOKENS[p[0]], 0);\n    for (let d = 0; d < DROP_ORDER.length && planned > budget; d++) {\n      const li = DROP_ORDER[d];\n      if (picks.some(p => p[0] === li)) { evicted[li] = true; planned -= LAYER_TOKENS[li]; }\n    }\n    const evictedNames = Object.keys(evicted).map(i => \"L\" + String(+i + 1).padStart(2, \"0\") + \" \" + LAYERS[+i][0]);\n    const shown = picks.slice(0, step).filter(p => !evicted[p[0]]);\n    const usedTokens = shown.reduce((t, p) => t + LAYER_TOKENS[p[0]], 0);\n    const segments = shown.map((p, k) => ({\n      style: \"flex: 0 0 \" + Math.min(100, (LAYER_TOKENS[p[0]] / budget) * 100) + \"%; min-width: 2px; transition: flex-basis 320ms ease; background: \" +\n        (k % 2 ? \"color-mix(in oklab, var(--accent) 62%, var(--bg))\" : \"var(--accent)\") + \";\",\n      title: \"L\" + String(p[0] + 1).padStart(2, \"0\") + \" \" + LAYERS[p[0]][0] + \" — ~\" + LAYER_TOKENS[p[0]] + \" tokens\"\n    }));\n    const fmt = n => n.toLocaleString(\"en-US\");\n    const rowBase = \"width: 100%; text-align: left; font-family: inherit; color: inherit; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid \";\n    const slots = LAYERS.map((l, i) => {\n      const pi = picks.findIndex(p => p[0] === i);\n      const inCase = allPicks.some(p => p[0] === i);\n      const used = pi >= 0;\n      const on = used && pi < step;\n      let rowStyle, tag, tagColor, numColor;\n      if (inCase && off[i]) {\n        rowStyle = rowBase + \"var(--accent); border-style: dashed; background: transparent; opacity: 0.7; transition: all 300ms ease;\";\n        tag = \"removed by you\"; tagColor = \"var(--accent)\"; numColor = \"color: var(--muted);\";\n      } else if (used && evicted[i]) {\n        rowStyle = rowBase + \"var(--line); background: transparent; opacity: 0.55; text-decoration: line-through; transition: all 300ms ease;\";\n        tag = \"evicted · budget\"; tagColor = \"var(--fg)\"; numColor = \"color: var(--muted);\";\n      } else if (on) {\n        rowStyle = rowBase + \"var(--accent); background: var(--accent-soft); transition: all 300ms ease;\";\n        tag = \"in payload\"; tagColor = \"var(--accent)\"; numColor = \"color: var(--accent);\";\n      } else if (used) {\n        rowStyle = rowBase + \"var(--line); background: transparent; transition: all 300ms ease;\";\n        tag = \"queued\"; tagColor = \"var(--muted)\"; numColor = \"color: var(--muted);\";\n      } else {\n        rowStyle = rowBase + \"transparent; background: transparent; opacity: 0.34; transition: all 300ms ease;\";\n        tag = \"not used\"; tagColor = \"var(--muted)\"; numColor = \"color: var(--muted);\";\n      }\n      return {\n        num: \"L\" + String(i + 1).padStart(2, \"0\"),\n        name: l[0],\n        rowStyle: rowStyle + (inCase ? \" cursor: pointer;\" : \" cursor: default;\"),\n        numColor, tag,\n        click: inCase ? () => this.toggleSlot(i) : () => {},\n        title: inCase ? (off[i] ? \"Click to add this layer back\" : \"Click to remove this layer\") : \"This system doesn't use this layer\",\n        numColor2: numColor,\n        tagStyle: \"font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; color: \" + tagColor + \";\"\n      };\n    });\n    const payload = shown.map(p => ({\n      tag: \"L\" + String(p[0] + 1).padStart(2, \"0\") + \" · \" + LAYERS[p[0]][0],\n      tokens: \"~\" + fmt(LAYER_TOKENS[p[0]]) + \" tok\",\n      text: p[1],\n      style: \"border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); padding: 10px 14px; animation: cwaRise 280ms cubic-bezier(.2,.8,.25,1) both;\"\n    }));\n    const out = {\n      layers,\n      key: run,\n      slots,\n      payload,\n      ucName: uc.name,\n      ucNote: uc.note,\n      ucQuestions: uc.questions.map(t => ({ text: t })),\n      usedLabel: picks.length + \" of 11 active\",\n      removed,\n      hasRemoved: removed.length > 0,\n      restoreAll: () => this.restoreSlots(),\n      progress: shown.length + \" / \" + (picks.length - evictedNames.length) + \" blocks\",\n      segments,\n      tokenLabel: \"~\" + fmt(usedTokens) + \" / \" + fmt(budget) + \" tokens\",\n      evictionLabel: evictedNames.length\n        ? \"Dropped to fit: \" + evictedNames.join(\", \") + \". The system still runs — it just knows less.\"\n        : \"Everything fits. Nothing had to be dropped.\",\n      budgets: BUDGETS.map((b, i) => ({\n        label: b >= 8192 ? \"8k\" : b >= 4096 ? \"4k\" : b >= 2048 ? \"2k\" : \"1k\",\n        style: this.ucTabStyle(i === (this.state.budget || 0)),\n        select: () => this.setState({ budget: i })\n      })),\n      playLabel: this.state.playing ? \"Pause\" : \"Play\",\n      togglePlay: () => this.setState(s => ({ playing: !s.playing })),\n      ucTabs: UCS.map((u, i) => ({\n        label: u.label,\n        style: this.ucTabStyle(i === this.state.uc),\n        select: () => this.setState({ uc: i, step: 0, hold: 0, playing: true })\n      })),\n      isStack: mode === \"stack\",\n      isIndex: mode === \"index\",\n      isAssembly: mode === \"assembly\",\n      tabStack: this.tab(mode === \"stack\"),\n      tabIndex: this.tab(mode === \"index\"),\n      tabAssembly: this.tab(mode === \"assembly\"),\n      setStack: () => this.setState({ mode: \"stack\" }),\n      setIndex: () => this.setState({ mode: \"index\" }),\n      setAssembly: () => this.setState({ mode: \"assembly\", run: this.state.run + 1 }),\n      replay: () => {\n        this.setState({ mode: \"index\" });\n        setTimeout(() => this.setState({ mode: \"assembly\", run: this.state.run + 1 }), 30);\n      },\n      skinSpec: this.skinBtn(this.state.skin === \"spec\"),\n      skinSwiss: this.skinBtn(this.state.skin === \"swiss\"),\n      skinTerminal: this.skinBtn(this.state.skin === \"terminal\"),\n      setSpec: () => this.applySkin(\"spec\"),\n      setSwiss: () => this.applySkin(\"swiss\"),\n      setTerminal: () => this.applySkin(\"terminal\"),\n      themeLabel: this.state.theme === \"dark\" ? \"Light\" : \"Dark\",\n      toggleTheme: () => this.applyTheme(this.state.theme === \"dark\" ? \"light\" : \"dark\")\n    };\n\n    const mu = UCS[this.state.mUc || 0];\n    const mstep = Math.min(this.state.mStep || 0, mu.picks.length);\n    const mShown = mu.picks.slice(0, mstep);\n    const mTok = mShown.reduce((t, p) => t + LAYER_TOKENS[p[0]], 0);\n    out.heroBlocks = mShown.map(p => ({\n      tag: \"L\" + String(p[0] + 1).padStart(2, \"0\") + \" · \" + LAYERS[p[0]][0],\n      text: p[1].length > 62 ? p[1].slice(0, 62).trim() + \"…\" : p[1]\n    }));\n    out.mUcName = mu.name;\n    out.mProgress = mstep + \" of 11 layers\";\n    out.mTokens = \"~\" + fmt(mTok) + \" tokens\";\n    out.mFill = \"height: 100%; width: \" + Math.min(100, (mTok / 4096) * 100) + \"%; background: var(--accent); transition: width 400ms ease;\";\n\n    const si = this.state.scaffold || 0;\n    const sc = SCAFFOLDS[si];\n    out.scaffoldTabs = SCAFFOLDS.map((s, i) => ({\n      label: s.label,\n      style: this.ucTabStyle(i === si),\n      select: () => this.setState({ scaffold: i, copied: false })\n    }));\n    out.scaffoldName = sc.filename;\n    out.scaffoldBlurb = sc.blurb;\n    out.scaffoldLines = sc.text.split(\"\\n\").map(t => ({ text: t === \"\" ? \" \" : t }));\n    out.copyLabel = this.state.copied ? \"Copied\" : \"Copy \" + sc.filename;\n    out.copyScaffold = () => this.copyScaffold();\n    out.downloadScaffold = () => this.downloadScaffold();\n    out.copyBtnStyle = \"font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--accent); border-radius: var(--pill); padding: 12px 22px; cursor: pointer; background: \" +\n      (this.state.copied ? \"var(--fg)\" : \"var(--accent)\") + \"; border-color: \" + (this.state.copied ? \"var(--fg)\" : \"var(--accent)\") + \"; color: var(--bg);\";\n\n    out.isBad = !!this.state.bad;\n    out.isGood = !this.state.bad;\n    out.badLabel = this.state.bad ? \"Show the good assembly\" : \"Show the broken assembly\";\n    out.badBtnStyle = \"font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid \" +\n      (this.state.bad ? \"var(--fg)\" : \"var(--line)\") + \"; background: \" + (this.state.bad ? \"var(--fg)\" : \"transparent\") +\n      \"; color: \" + (this.state.bad ? \"var(--bg)\" : \"var(--muted)\") + \"; border-radius: var(--pill); padding: 9px 16px; cursor: pointer;\";\n    out.toggleBad = () => this.setState(s => ({ bad: !s.bad, playing: false, step: 99 }));\n    out.ucSymptom = uc.symptom;\n    out.badNotes = [\n      { text: \"Instructions and retrieved text are indistinguishable, so any document in the window can overrule the system prompt.\" },\n      { text: \"History is unbounded: as the session grows, the oldest turns push the newest constraints out of the window.\" },\n      { text: \"The query sits in the middle of the payload instead of last, losing the recency advantage entirely.\" }\n    ];\n\n    if (this.state.bad) {\n      const hasHistory = allPicks.some(p => p[0] === 5);\n      const queryPick = allPicks.find(p => p[0] === 10);\n      const merged = allPicks.filter(p => p[0] !== 5 && p[0] !== 10);\n      const mergedTokens = Math.round(merged.reduce((t, p) => t + LAYER_TOKENS[p[0]], 0) * 1.15);\n      const tailTokens = hasHistory ? 3200 : 2400;\n      const badStyle = \"border: 1px solid var(--fg); border-left: 3px solid var(--fg); background: var(--surface); padding: 12px 14px;\";\n      const blocks = [\n        { tag: \"One prose blob — \" + merged.length + \" layers concatenated\", tokens: \"~\" + fmt(mergedTokens) + \" tok\",\n          text: merged.map(p => p[1]).join(\"  \"), style: badStyle },\n        { tag: queryPick ? \"The query, buried mid-window\" : \"No clear trigger\", tokens: \"~40 tok\",\n          text: queryPick ? queryPick[1] : \"(the request is somewhere in the blob above)\", style: badStyle }\n      ];\n      blocks.push(hasHistory\n        ? { tag: \"Chat history, unbounded — 84 turns verbatim\", tokens: \"~\" + fmt(tailTokens) + \" tok\",\n            text: \"…every turn since the session opened, oldest first, nothing summarised and nothing trimmed.\", style: badStyle }\n        : { tag: \"Tool output, re-appended on every loop\", tokens: \"~\" + fmt(tailTokens) + \" tok\",\n            text: \"…the same result pasted again each iteration, three copies deep and growing.\", style: badStyle });\n      const badTotal = mergedTokens + tailTokens + 40;\n      out.payload = blocks;\n      out.segments = blocks.map((b, k) => ({\n        style: \"flex: 0 0 \" + ((k === 0 ? mergedTokens : k === 1 ? 40 : tailTokens) / budget) * 100 + \"%; min-width: 2px; background: \" +\n          (k % 2 ? \"color-mix(in oklab, var(--fg) 55%, var(--bg))\" : \"var(--fg)\") + \";\",\n        title: b.tag\n      }));\n      out.tokenLabel = \"~\" + fmt(badTotal) + \" / \" + fmt(budget) + \" tokens\";\n      out.progress = \"3 blobs · no structure\";\n      out.evictionLabel = badTotal > budget\n        ? \"Over budget by \" + fmt(badTotal - budget) + \" tokens, and nothing can be dropped cleanly — the layers are fused together.\"\n        : \"It fits, but nothing in here can be measured, trimmed, or swapped independently.\";\n      out.usedLabel = \"structure lost\";\n      out.hasRemoved = false;\n      out.slots = LAYERS.map((l, i) => {\n        const inCase = allPicks.some(p => p[0] === i);\n        let tag, style;\n        if (!inCase) { tag = \"not used\"; style = rowBase + \"transparent; background: transparent; opacity: 0.3;\"; }\n        else if (i === 5 || i === 10) { tag = \"misordered\"; style = rowBase + \"var(--fg); border-style: dashed; background: transparent;\"; }\n        else { tag = \"merged into the blob\"; style = rowBase + \"var(--line); background: transparent; opacity: 0.7;\"; }\n        return {\n          num: \"L\" + String(i + 1).padStart(2, \"0\"),\n          name: l[0], tag,\n          rowStyle: style + \" cursor: default;\",\n          numColor: \"color: var(--muted);\",\n          title: \"Structure is lost in the broken assembly\",\n          click: () => {},\n          tagStyle: \"font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; color: var(--muted);\"\n        };\n      });\n    }\n    this.tourVals(out);\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
