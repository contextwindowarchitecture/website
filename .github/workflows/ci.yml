# Generated artifacts are current, and the contract and site tests pass, on each supported Node; the vendored
# specification is the specification repository's at the commit spec.lock.json names; and the home page's vendored
# example is the examples repository's at the commit examples.lock.json names. A tag runs it through
# release.yml, on the tagged commit, against the specification repository at the same tag.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; release.yml passes the tag
        type: string
        default: ""
      spec_ref:
        description: The specification ref to check the vendored files against; release.yml passes the same tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  spec:
    name: vendored specification matches its repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: lock
        run: echo "commit=$(node -p "require('./spec.lock.json').commit")" >> "$GITHUB_OUTPUT"
      # The commit or tag must be pushed to the specification repository for this checkout to find it.
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/contextwindowarchitecture
          ref: ${{ inputs.spec_ref || steps.lock.outputs.commit }}
          path: spec
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/vendor-spec.mjs spec --check

  examples:
    name: vendored example matches its repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: lock
        run: echo "commit=$(node -p "require('./examples.lock.json').commit")" >> "$GITHUB_OUTPUT"
      # Not at ./examples, which holds the specification's examples.
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/examples
          ref: ${{ steps.lock.outputs.commit }}
          path: examples-repo
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/vendor-examples.mjs examples-repo --check
